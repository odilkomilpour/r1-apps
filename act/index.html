<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>Act</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0e10;--fg:#f2f2f2;--dim:rgba(255,255,255,.45);--line:rgba(255,255,255,.12);--accent:#FE5000;--ok:#86EFAC}
html,body{width:240px;height:282px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,Roboto,sans-serif}
#top{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);font-size:10px;color:var(--dim);letter-spacing:.08em}
#title{color:var(--accent);font-weight:700}
#dots{display:flex;gap:4px}.dot{width:5px;height:5px;border-radius:50%;background:var(--line)}.dot.on{background:var(--accent)}
.page{display:none;height:232px;padding:8px 10px;flex-direction:column}.page.on{display:flex}
#hint{height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;font-size:13px;line-height:1.3}
.row.sel{background:rgba(254,80,0,.12);border-left:2px solid var(--accent)}
.box{flex:none;width:14px;height:14px;border:1.5px solid var(--dim);border-radius:3px}
.row.done .box{background:var(--ok);border-color:var(--ok)}.row.done .t{color:var(--dim);text-decoration:line-through}
.empty{color:var(--dim);font-size:12px;line-height:1.5;padding:10px 4px}
.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin-top:14px}
.mid{font-size:12px;color:var(--dim);text-align:center;margin-top:4px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:14px 6px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s linear}
.btn{margin:14px auto 0;padding:7px 18px;border:1px solid var(--accent);border-radius:16px;color:var(--accent);font-size:12px;background:none}
.chips{display:flex;gap:4px;justify-content:center;margin-top:4px}.chip{font-size:10px;padding:3px 6px;border:1px solid var(--line);border-radius:10px;color:var(--dim)}.chip.on{border-color:var(--accent);color:var(--accent)}
.splits{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px;text-align:center;font-variant-numeric:tabular-nums}
#list{overflow:hidden}#notes{overflow:hidden}
.note{font-size:12px;line-height:1.35;padding:6px 4px;border-bottom:1px solid var(--line)}.note b{color:var(--dim);font-weight:400;font-size:10px;display:block}
#listen{position:absolute;inset:0;background:rgba(14,14,16,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:13px}
#listen.on{display:flex}#listen i{width:16px;height:16px;border-radius:50%;background:var(--accent);animation:p 1s infinite}
@keyframes p{50%{opacity:.3;transform:scale(.7)}}
</style>
</head>
<body>
<div id="top"><span id="title">ACT</span><div id="dots"></div><span id="clock"></span></div>

<section class="page" id="p-wins"><div id="list"></div></section>

<section class="page" id="p-focus">
  <div class="big" id="ftime">25:00</div>
  <div class="mid" id="fstate">wheel = minutes</div>
  <div class="bar"><i id="fbar"></i></div>
  <button class="btn" id="fgo">Start</button>
</section>

<section class="page" id="p-run">
  <div class="chips" id="dist"></div>
  <div class="big" id="rtime" style="font-size:34px">3:00:00</div>
  <div class="mid" id="rpace"></div>
  <div class="splits" id="rsplits"></div>
</section>

<section class="page" id="p-notes"><div id="notes"></div></section>

<div id="hint"></div>
<div id="listen"><i></i><span>Listening…</span></div>

<script>
// ACT: a small R1 creation. Four pages, side button cycles them:
// WINS (today's 3 must-wins) · FOCUS (timer) · RUN (pace + splits) · NOTES (voice capture).
// Hold the side button to speak (adds a must-win on WINS, a note on NOTES).
// All data stays on the device (localStorage); nothing is sent anywhere except to the R1's own assistant.
var PAGES = [
  {id: 'p-wins',  name: 'WINS',  hint: 'hold = add · wheel = pick · tap = done'},
  {id: 'p-focus', name: 'FOCUS', hint: 'wheel = minutes · tap Start'},
  {id: 'p-run',   name: 'RUN',   hint: 'wheel = goal time · tap a distance'},
  {id: 'p-notes', name: 'NOTES', hint: 'hold = speak a note · wheel = scroll'}
];
var page = +((location.hash.match(/p=(\d)/) || [])[1] || 0) % 4;   // #p=2 opens a page directly (testing)
var $ = function (id) { return document.getElementById(id); };
var today = new Date().toISOString().slice(0, 10);

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ampm(d) { var h = d.getHours(), m = pad(d.getMinutes()); return ((h % 12) || 12) + ':' + m + (h < 12 ? ' am' : ' pm') + ' (' + pad(h) + ':' + m + ')'; }

// Speak through the R1 speaker via its assistant (asks it to repeat a sentence word for word).
function say(text) {
  if (typeof PluginMessageHandler === 'undefined') { console.log('SAY:', text); return; }
  PluginMessageHandler.postMessage(JSON.stringify({message: 'Say exactly this sentence, nothing else: ' + text, useLLM: true, wantsR1Response: true}));
}

// ---------- navigation ----------
function show() {
  PAGES.forEach(function (p, i) { $(p.id).classList.toggle('on', i === page); });
  $('title').textContent = PAGES[page].name;
  $('hint').textContent = PAGES[page].hint;
  $('dots').innerHTML = PAGES.map(function (_, i) { return '<span class="dot' + (i === page ? ' on' : '') + '"></span>'; }).join('');
  render();
}
function render() { [renderWins, renderFocus, renderRun, renderNotes][page](); }
function tickClock() { $('clock').textContent = ampm(new Date()).split(' (')[0]; }
tickClock(); setInterval(tickClock, 1000);

// ---------- WINS ----------
var wins = load('act_wins', {day: today, items: []});
if (wins.day !== today) wins = {day: today, items: []};       // a fresh list every morning
var sel = 0;
function renderWins() {
  if (!wins.items.length) { $('list').innerHTML = '<div class="empty">What are today\'s 3 must-wins?<br><br>Hold the side button and say one.</div>'; return; }
  $('list').innerHTML = wins.items.map(function (w, i) {
    return '<div class="row' + (w.done ? ' done' : '') + (i === sel ? ' sel' : '') + '" data-i="' + i + '"><span class="box"></span><span class="t">' + esc(w.t) + '</span></div>';
  }).join('') + (wins.items.length < 3 ? '<div class="empty">' + (3 - wins.items.length) + ' more to name</div>' : '');
}
function toggleWin(i) {
  var w = wins.items[i]; if (!w) return;
  w.done = !w.done; save('act_wins', wins); renderWins();
  if (w.done) {
    var left = wins.items.filter(function (x) { return !x.done; }).length;
    say(left ? 'Done. ' + left + ' left today.' : 'All must-wins done. Well done.');
  }
}
$('list').addEventListener('click', function (e) { var r = e.target.closest('.row'); if (r) { sel = +r.dataset.i; toggleWin(sel); } });

// ---------- FOCUS ----------
var fMin = 25, fEnd = 0, fLeft = 0, fTick = null;
function fmt(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function renderFocus() {
  var running = !!fTick, s = running ? Math.max(0, Math.round((fEnd - Date.now()) / 1000)) : (fLeft || fMin * 60);
  $('ftime').textContent = fmt(s);
  $('fstate').textContent = running ? 'until ' + ampm(new Date(fEnd)) : (fLeft ? 'paused' : 'wheel = minutes');
  $('fbar').style.width = (100 * (1 - s / (fMin * 60))) + '%';
  $('fgo').textContent = running ? 'Pause' : (fLeft ? 'Resume' : 'Start');
}
function focusGo() {
  if (fTick) { fLeft = Math.round((fEnd - Date.now()) / 1000); clearInterval(fTick); fTick = null; renderFocus(); return; }
  fEnd = Date.now() + (fLeft || fMin * 60) * 1000; fLeft = 0;
  fTick = setInterval(function () {
    if (Date.now() >= fEnd) { clearInterval(fTick); fTick = null; fLeft = 0; say(fMin + ' minutes done. What did you finish? Take a short break.'); }
    if (page === 1) renderFocus();
  }, 1000);
  renderFocus();
}
$('fgo').addEventListener('click', focusGo);

// ---------- RUN ----------
var DIST = [{n: '5K', km: 5}, {n: '10K', km: 10}, {n: 'Half', km: 21.0975}, {n: 'Full', km: 42.195}];
var run = load('act_run', {d: 3, sec: 3 * 3600});               // default: sub-3 marathon
function hms(s) { s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60); }
function renderRun() {
  var d = DIST[run.d], pace = run.sec / d.km;
  $('dist').innerHTML = DIST.map(function (x, i) { return '<span class="chip' + (i === run.d ? ' on' : '') + '" data-i="' + i + '">' + x.n + '</span>'; }).join('');
  $('rtime').textContent = hms(run.sec);
  $('rpace').textContent = hms(pace) + ' /km';
  var step = d.km > 40 ? 10 : d.km > 20 ? 5 : d.km > 6 ? 2 : 1, out = [];
  for (var k = step; k < d.km && out.length < 8; k += step) out.push(k + ' km  ' + hms(pace * k));
  out.push(d.n + '  ' + hms(run.sec));
  $('rsplits').innerHTML = out.join('<br>');
}
$('dist').addEventListener('click', function (e) {
  var c = e.target.closest('.chip'); if (!c) return;
  var old = DIST[run.d].km; run.d = +c.dataset.i;
  run.sec = Math.round(run.sec / old * DIST[run.d].km / 60) * 60;  // keep the same pace
  save('act_run', run); renderRun();
});

// ---------- NOTES ----------
var notes = load('act_notes', []), nTop = 0;
function renderNotes() {
  if (!notes.length) { $('notes').innerHTML = '<div class="empty">Hold the side button and speak an idea, a thought or a task.<br><br>Notes stay on this R1.</div>'; return; }
  $('notes').innerHTML = notes.slice(nTop, nTop + 6).map(function (n) { return '<div class="note"><b>' + esc(n.at) + '</b>' + esc(n.t) + '</div>'; }).join('');
}

// ---------- voice ----------
var listening = false;
function heard(text) {
  text = (text || '').trim(); if (!text) return;
  if (page === 0) {
    if (wins.items.length >= 3) { say('You already have three must-wins. Finish one first.'); return; }
    wins.items.push({t: text, done: false}); sel = wins.items.length - 1; save('act_wins', wins); renderWins();
  } else {
    var now = new Date();
    notes.unshift({t: text, at: now.toISOString().slice(0, 10) + ' ' + ampm(now)}); notes = notes.slice(0, 200);
    save('act_notes', notes); nTop = 0; if (page !== 3) { page = 3; show(); } else renderNotes();
  }
}
window.onPluginMessage = function (data) {
  if (data && data.type === 'sttEnded') { listening = false; $('listen').classList.remove('on'); heard(data.transcript); }
};
window.addEventListener('longPressStart', function () {
  if (listening || page === 1 || page === 2) return;
  listening = true; $('listen').classList.add('on');
  if (typeof CreationVoiceHandler !== 'undefined') CreationVoiceHandler.postMessage('start');
  else setTimeout(function () { window.onPluginMessage({type: 'sttEnded', transcript: prompt('Say (test):') || ''}); }, 10);
});
window.addEventListener('longPressEnd', function () {
  if (listening && typeof CreationVoiceHandler !== 'undefined') CreationVoiceHandler.postMessage('stop');
});

// ---------- side button + wheel ----------
var clickTimer = null;
window.addEventListener('sideClick', function () {        // double-click fires two events ~50 ms apart: debounce
  if (clickTimer) return;
  clickTimer = setTimeout(function () { clickTimer = null; page = (page + 1) % PAGES.length; show(); }, 120);
});
function wheel(dir) {
  if (page === 0 && wins.items.length) { sel = Math.min(wins.items.length - 1, Math.max(0, sel + dir)); renderWins(); }
  if (page === 1 && !fTick && !fLeft) { fMin = Math.min(90, Math.max(5, fMin + dir * 5)); renderFocus(); }
  if (page === 2) { run.sec = Math.max(600, run.sec + dir * 60); save('act_run', run); renderRun(); }
  if (page === 3) { nTop = Math.min(Math.max(0, notes.length - 1), Math.max(0, nTop + dir)); renderNotes(); }
}
window.addEventListener('scrollUp', function () { wheel(-1); });
window.addEventListener('scrollDown', function () { wheel(1); });

// keyboard stand-ins for testing on a computer
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') window.dispatchEvent(new Event('sideClick'));
  if (e.key === 'ArrowUp') window.dispatchEvent(new Event('scrollUp'));
  if (e.key === 'ArrowDown') window.dispatchEvent(new Event('scrollDown'));
  if (e.key === ' ' && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
  if (e.key === 'Enter' && page === 0) toggleWin(sel);
});
document.addEventListener('keyup', function (e) { if (e.key === ' ') window.dispatchEvent(new Event('longPressEnd')); });

show();
</script>
</body>
</html>
