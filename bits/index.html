<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>Bits</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07131a;--fg:#e6f6ff;--dim:rgba(230,246,255,.5);--line:rgba(230,246,255,.14);--accent:#2DD4BF;--on:#2DD4BF;--ok:#86EFAC}
html,body{width:240px;height:282px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,Roboto,sans-serif}
#top{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
#top b{color:var(--accent);letter-spacing:.06em}
#main{height:228px;padding:8px 10px;display:flex;flex-direction:column}
#hint{height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);border-top:1px solid var(--line)}
.bits{display:flex;gap:3px;justify-content:center;margin-top:6px}
.bit{width:24px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bit .v{width:24px;height:34px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--dim)}
.bit.on .v{background:var(--on);border-color:var(--on);color:#07131a}
.bit.cur .v{box-shadow:0 0 0 2px #fff}
.bit .w{font-size:9px;color:var(--dim)}
.bulb{width:10px;height:10px;border-radius:50%;background:var(--line)}.bit.on .bulb{background:#FDE047;box-shadow:0 0 8px #FDE047}
.dec{font-size:40px;font-weight:700;text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
.sum{font-size:11px;color:var(--dim);text-align:center;min-height:15px}
.goal{margin-top:8px;text-align:center;font-size:13px}.goal b{color:var(--accent);font-size:18px}
.goal.win{color:var(--ok)}
.stat{font-size:10px;color:var(--dim);text-align:center;margin-top:4px}
#ans{font-size:13px;line-height:1.4;flex:1;overflow:hidden;margin-top:6px}
#qq{font-size:12px;color:var(--dim);min-height:16px}
.tabs{display:flex;gap:4px}.tabs span{font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}.tabs span.on{border-color:var(--accent);color:var(--accent)}
#listen{position:absolute;inset:0;background:rgba(7,19,26,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:14px}
#listen.on{display:flex}#listen i{width:18px;height:18px;border-radius:50%;background:var(--accent);animation:p 1s infinite}
@keyframes p{50%{opacity:.3;transform:scale(.6)}}
</style>
</head>
<body>
<div id="top"><b id="ttl">BITS</b><span class="tabs" id="tabs"></span></div>
<div id="main"></div>
<div id="hint"></div>
<div id="listen"><i></i><span>Ask your tech question…</span></div>

<script>
// Bits: a Technology-lesson toy for the R1.
// 1) BINARY: 8 switches (bits). Wheel moves the cursor, tap the screen flips a bit,
//    the number updates live. Challenge: make the target number; the R1 says "correct".
// 2) ASK: hold the side button, ask any tech question; the R1 explains it simply, out loud.
// Side button switches the two modes.
var $ = function (id) { return document.getElementById(id); };
var R1 = typeof PluginMessageHandler !== 'undefined';
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function say(text) {
  if (!R1) { console.log('SAY:', text); return; }
  PluginMessageHandler.postMessage(JSON.stringify({message: 'Say exactly this, nothing else: ' + text, useLLM: true, wantsR1Response: true}));
}

var mode = 0;                        // 0 = BINARY, 1 = ASK
var bits = [0, 0, 0, 0, 0, 0, 0, 0], cur = 7, target = newTarget(), level = load('bits_level', 1), solved = load('bits_solved', 0);
var lastQ = '', lastA = '';

function value() { return bits.reduce(function (s, b, i) { return s + b * Math.pow(2, 7 - i); }, 0); }
function newTarget() { var max = Math.pow(2, Math.min(8, 2 + (typeof level === 'number' ? level : 1))) - 1; return 1 + Math.floor(Math.random() * max); }

function render() {
  $('tabs').innerHTML = ['Binary', 'Ask'].map(function (t, i) { return '<span class="' + (i === mode ? 'on' : '') + '">' + t + '</span>'; }).join('');
  if (mode === 0) {
    var v = value(), parts = [];
    bits.forEach(function (b, i) { if (b) parts.push(Math.pow(2, 7 - i)); });
    $('main').innerHTML = '<div class="bits">' + bits.map(function (b, i) {
      return '<div class="bit' + (b ? ' on' : '') + (i === cur ? ' cur' : '') + '" data-i="' + i + '"><span class="bulb"></span><span class="v">' + b + '</span><span class="w">' + Math.pow(2, 7 - i) + '</span></div>';
    }).join('') + '</div><div class="dec">' + v + '</div><div class="sum">' + (parts.length ? parts.join(' + ') + ' = ' + v : 'all switches off = 0') + '</div>' +
      '<div class="goal' + (v === target ? ' win' : '') + '">' + (v === target ? 'Correct! ✓  wheel to next' : 'Make <b>' + target + '</b>') + '</div>' +
      '<div class="stat">level ' + level + ' · solved ' + solved + '</div>';
    $('hint').textContent = 'wheel = move · tap = flip · button = Ask';
  } else {
    $('main').innerHTML = '<div id="qq">' + (lastQ ? '“' + esc(lastQ) + '”' : '') + '</div><div id="ans">' +
      esc(lastA || 'Hold the side button and ask a tech question, like “How does Wi-Fi work?” or “What is a pixel?”') + '</div>';
    $('hint').textContent = 'hold = ask · button = Binary';
  }
}

function flip(i) {
  bits[i] = bits[i] ? 0 : 1; cur = i;
  if (value() === target) { solved++; save('bits_solved', solved); if (solved % 3 === 0 && level < 6) { level++; save('bits_level', level); } say('Correct! ' + target + ' in binary is ' + bits.join('').replace(/^0+/, '') + '.'); }
  render();
}
$('main').addEventListener('click', function (e) {
  if (mode !== 0) return;
  var b = e.target.closest('.bit');
  if (b) flip(+b.dataset.i); else flip(cur);          // tapping anywhere else flips the bit under the cursor
});

// ---------- ASK ----------
var waiting = false, waitT = null;
function askTech(q) {
  lastQ = q; lastA = 'Thinking…'; render();
  if (!R1) { lastA = '(On the R1 the assistant answers here and out loud.)'; render(); return; }
  waiting = true; clearTimeout(waitT);
  waitT = setTimeout(function () { if (waiting) { waiting = false; lastA = 'No answer. Try again.'; render(); } }, 25000);
  PluginMessageHandler.postMessage(JSON.stringify({
    message: 'You are a Technology teacher for students aged 11 to 14. Answer this question in at most 3 short sentences, simply, with one everyday example: "' + q + '"',
    useLLM: true, wantsR1Response: true
  }));
}
window.onPluginMessage = function (data) {
  if (data && data.type === 'sttEnded') { listening = false; $('listen').classList.remove('on'); var t = (data.transcript || '').trim(); if (t) askTech(t); return; }
  if (waiting) {
    waiting = false; clearTimeout(waitT);
    var raw = data && (data.message || data.data);
    lastA = typeof raw === 'string' ? raw : raw ? JSON.stringify(raw) : 'No answer. Try again.'; render();
  }
};

// ---------- hardware ----------
var listening = false;
window.addEventListener('longPressStart', function () {
  if (listening || mode !== 1) return;
  listening = true; $('listen').classList.add('on');
  if (typeof CreationVoiceHandler !== 'undefined') CreationVoiceHandler.postMessage('start');
  else setTimeout(function () { window.onPluginMessage({type: 'sttEnded', transcript: prompt('Question (test):') || ''}); }, 10);
});
window.addEventListener('longPressEnd', function () { if (listening && typeof CreationVoiceHandler !== 'undefined') CreationVoiceHandler.postMessage('stop'); });
var clickT = null;
window.addEventListener('sideClick', function () {
  if (clickT) return;
  clickT = setTimeout(function () { clickT = null; mode = 1 - mode; render(); }, 120);
});
function wheel(d) {
  if (mode !== 0) return;
  if (value() === target && d > 0) { target = newTarget(); bits = [0, 0, 0, 0, 0, 0, 0, 0]; cur = 7; render(); return; }
  cur = Math.min(7, Math.max(0, cur + d)); render();
}
window.addEventListener('scrollUp', function () { wheel(-1); });
window.addEventListener('scrollDown', function () { wheel(1); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') window.dispatchEvent(new Event('sideClick'));
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') window.dispatchEvent(new Event('scrollUp'));
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') window.dispatchEvent(new Event('scrollDown'));
  if (e.key === 'Enter') flip(cur);
  if (e.key === ' ' && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
});
document.addEventListener('keyup', function (e) { if (e.key === ' ') window.dispatchEvent(new Event('longPressEnd')); });
mode = +((location.hash.match(/m=(\d)/) || [])[1] || 0) % 2;   // #m=1 opens Ask (testing)
render();
</script>
</body>
</html>
